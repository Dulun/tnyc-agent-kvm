appId: com.tnyc.agentkvm
productName: TNYC Agent KVM
directories:
  output: release
  buildResources: build-resources
icon: build-resources/icon.png
files:
  - build/**/*
  - package.json
extraResources:
  - from: assets
    to: assets
  - from: build/agent
    to: agent
asar: true
# ssh2's cpu-features is optional (pure-JS fallback); rebuilding it needs a
# toolchain and fails on a clean machine, so never rebuild native modules.
npmRebuild: false
mac:
  category: public.app-category.developer-tools
  extendInfo:
    # macOS 15+ asks once; without the prompt a sandboxed/local-network connect fails with EHOSTUNREACH.
    NSLocalNetworkUsageDescription: Connect to the Ubuntu host over your local network (SSH).
  target:
    - dmg
    - zip
  hardenedRuntime: true
linux:
  executableArgs:
    - --no-sandbox
  target:
    - AppImage
    - deb
  category: Development
win:
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
